name: Pulsation
options:
  bundleIdPrefix: com.bdt
  developmentLanguage: en
  xcodeVersion: "27.2"
  projectFormat: xcode16_0
  postGenCommand: >-
    sed -i '' -e 's|objectVersion = 54;|objectVersion = 56;|' Pulsation.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Pulsation:
    type: application.watchapp2-container
    platform: iOS
    dependencies:
      - target: Pulsation Watch App
        embed: true
    settings:
      base:
        DEVELOPMENT_TEAM: VGW4QWQ3R5
        PRODUCT_BUNDLE_IDENTIFIER: com.bdt.pulsation
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulsation
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  Pulsation Watch App:
    type: application
    platform: watchOS
    sources:
      - Pulsation
    info:
      path: Pulsation/Info.plist
      properties:
        CFBundleDisplayName: Pulsation
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: VGW4QWQ3R5
        PRODUCT_BUNDLE_IDENTIFIER: com.bdt.pulsation.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  Pulsation:
    build:
      targets:
        Pulsation: all
    archive:
      config: Release
  Pulsation Watch App:
    build:
      targets:
        Pulsation Watch App: all
    run:
      config: Debug
      executable: Pulsation Watch App
    archive:
      config: Release
