name: Pulsation
options:
  bundleIdPrefix: com.bdt
  developmentLanguage: en
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "4"
targets:
  Pulsation Watch App:
    type: application
    platform: watchOS
    sources:
      - Pulsation
    info:
      path: Pulsation/Info.plist
      properties:
        CFBundleDisplayName: Pulsation
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdt.pulsation
        GENERATE_INFOPLIST_FILE: YES
